<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刀剣乱舞 ぱずぎり 素材計算ツール</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.13.3/dist/vuetify.min.css">
<!-- calc.html / event.html 共通のスタイル -->
<link rel="stylesheet" href="components/common.css">
<style>
	/* ===== タブ（目標設定・計算結果） ===== */
	/* タブだと分かるよう、見出しタブの形にする（選択中=塗りつぶし / それ以外=枠線）。
	   下線でタブの列と中身をつなぎ、ボタン群（v-btn-toggle）とは形で見分けられるようにする */
	.box-tabs { height: auto !important; border-bottom: 2px solid rgb(var(--v-theme-primary)); }
	.box-tabs .v-slide-group__content { gap: 4px; }
	.box-tabs .v-tab.v-btn {
		height: 36px;
		border: 1px solid rgba(var(--v-theme-primary), .55);
		border-bottom: none;
		border-radius: 8px 8px 0 0;
		background: rgb(var(--v-theme-surface));
		color: rgba(var(--v-theme-on-surface), var(--v-high-emphasis-opacity));
		text-transform: none;
		letter-spacing: normal;
	}
	.box-tabs .v-tab.v-tab--selected {
		border-color: rgb(var(--v-theme-primary));
		background: rgb(var(--v-theme-primary));
		color: rgb(var(--v-theme-on-primary));
		font-weight: 700;
	}

	/* ===== 目標設定 ===== */
	.field-label { display: block; font-size: .8rem; margin-bottom: 4px; color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
	/* 強化段階のボタン: 「(調査中)」が付いても幅に収まるよう、高さは内容に合わせる */
	.stage-toggle { height: auto !important; }
	.stage-toggle .v-btn { height: auto !important; min-height: 36px; padding: 4px 6px !important; text-transform: none; letter-spacing: normal; }
	.stage-label { line-height: 1.25; text-align: center; white-space: normal; }
	.stage-pending { display: block; font-size: .72rem; white-space: nowrap; }
	/* 必要数量の内訳（アイテム分 ＋ 刀剣男士由来の分） */
	.target-breakdown { display: block; margin-top: 2px; font-size: .72rem; line-height: 1.5; color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
	.target-override { display: block; color: rgb(var(--v-theme-primary)); }
	.target-reset { display: inline-block; margin-left: 4px; white-space: nowrap; }
	/* 内訳の1項目（「＋ 三日月宗近(レア) 4」）は、なるべく途中で改行しない */
	.breakdown-part { display: inline-block; max-width: 100%; margin-right: .35em; }

	/* ===== 所持数一覧（一覧・入力欄のスタイルは components/common.css） ===== */
	.inventory-need { display: inline-block; margin-left: 6px; font-size: .75rem; color: rgb(var(--v-theme-error)); white-space: nowrap; }

	/* ===== 結果テーブル ===== */
	.result-table th { white-space: nowrap; }
	.result-table td.need { font-weight: 700; }
	.result-table tr.row-done td { color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
	.result-table tr.row-done td.need { font-weight: 400; }
	/* 区切りの境界線（目標 | bom.json 記載の材料 | 分解して出てきたアイテム） */
	.result-table tr.section-break td { border-top: 2px solid rgba(var(--v-theme-on-surface), .45) !important; }
	.summary { font-size: 1rem; line-height: 1.7; margin-bottom: 12px; }
	.summary strong { font-size: 1.15rem; }

	/* ===== アドレス推薦 ===== */
	.addr-table td { vertical-align: top; padding-top: 10px !important; padding-bottom: 10px !important; }
	.rank { font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
	.addr-table th { white-space: nowrap; }
	.tie { display: block; white-space: nowrap; font-size: .7rem; font-weight: 400; color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
	.addr-code { font-weight: 700; white-space: nowrap; }
	.addr-name { font-size: .8rem; color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
	.chips { display: flex; flex-wrap: wrap; gap: 6px; }
	/* 自動スクロールで移動したとき、固定ヘッダーの裏に隠れないようにする */
	#result-card, #inventory-card { scroll-margin-top: 64px; }
	/* 出陣中のマップ行（推奨マップ）と、所持数の出陣中タブの見出し */
	.addr-table tr.row-sortie td { background: rgba(var(--v-theme-primary), .14); }
	.addr-table .sortie-cell { vertical-align: middle !important; white-space: nowrap; }
	.sortie-caption { font-size: .8rem; color: rgb(var(--v-theme-primary)); }
	.missing-note { margin-top: 6px; font-size: .78rem; color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
	.only-mark { margin-left: 6px; font-size: .7rem; font-weight: 700; }
	.score { font-weight: 700; }
	.kind-inline { display: none; }

	/* ===== スマホ幅 ===== */
	@media (max-width: 599px) {
		/* 結果表: 区分列をアイテム名の下に移して4列に収める */
		.result-table .kind-col { display: none; }
		.kind-inline { display: block; margin-top: 2px; }
		.result-table th, .result-table td { padding: 0 8px !important; }
		.result-table td { height: auto !important; padding-top: 6px !important; padding-bottom: 6px !important; }
		/* アドレス表: 行をカード状に積む */
		.addr-table thead { display: none; }
		.addr-table table, .addr-table tbody { display: block; }
		.addr-table tr {
			display: grid;
			grid-template-columns: 3.2em 1fr auto;
			grid-template-areas: "rank addr btn" "rank items items" "rank score score";
			row-gap: 6px;
			padding: 12px 0;
			border-bottom: 1px solid rgba(var(--v-border-color), var(--v-border-opacity));
		}
		.addr-table td { display: block; border: none !important; height: auto !important; padding: 0 8px !important; }
		.addr-table td:nth-child(1) { grid-area: rank; text-align: center !important; }
		.addr-table td:nth-child(2) { grid-area: addr; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
		.addr-table td:nth-child(3) { grid-area: items; }
		.addr-table td:nth-child(4) { grid-area: score; text-align: left !important; display: flex; align-items: baseline; gap: 8px; }
		.addr-table td:nth-child(5) { grid-area: btn; }
		.addr-table tr.row-sortie { background: rgba(var(--v-theme-primary), .14); }
		.addr-table tr.row-sortie td { background: transparent; }
		.addr-table .breakdown { white-space: normal; }
	}
	.breakdown { font-size: .72rem; line-height: 1.5; white-space: nowrap; color: rgba(var(--v-theme-on-surface), var(--v-medium-emphasis-opacity)); }
</style>
</head>
<body>
<div id="app"></div>

<!-- ===== 画面テンプレート（Vueのテンプレートコンパイラで解釈させるため x-template に置く） ===== -->
<script type="text/x-template" id="app-template">
<v-app>
	<!-- 共通ヘッダー・メニュー（components/layout/*.vue） -->
	<layout-header @menu-click="menuOpen = !menuOpen"></layout-header>
	<layout-menu v-model="menuOpen" page="calc"></layout-menu>

	<v-main>
		<v-container class="page py-4">

			<!-- 読み込み中 -->
			<div v-if="loading" class="d-flex align-center ga-3 pa-6">
				<v-progress-circular indeterminate color="primary" size="24"></v-progress-circular>
				<span>データを読み込んでいます…</span>
			</div>

			<!-- データを読み込めない・データに誤りがある（計算不可）。詳細は開発者向けにコンソールへ出力 -->
			<v-alert v-if="dataErrors.length" type="error" variant="tonal" class="mb-4">
				データを読み込めなかったため、計算できません。時間をおいてページを再読み込みしてください。
			</v-alert>

			<v-row v-if="ready">
				<!-- ===== 左列：目標設定・所持数 ===== -->
				<v-col cols="12" md="5" lg="4">

					<!-- 目標設定 -->
					<v-card class="mb-4" border flat>
						<v-card-title class="section-title pt-4">目標設定</v-card-title>
						<v-card-text>
							<!-- 目標の選び方（アイテム / 刀剣男士）。どちらで選んだ分も下の「必要数量」に合算する -->
							<v-tabs v-model="targetTab" density="compact" grow hide-slider class="box-tabs mb-4">
								<v-tab value="item">アイテム</v-tab>
								<v-tab value="sword">刀剣男士</v-tab>
							</v-tabs>

							<div v-show="targetTab === 'item'">
								<v-select
									id="target-select"
									v-model="targetIds"
									:items="targetSelectItems"
									label="最終的に欲しいアイテム（複数選択可）"
									multiple chips closable-chips clearable
									variant="outlined" density="comfortable"
									hide-details
									class="mb-4"
								></v-select>
							</div>

							<div v-show="targetTab === 'sword'">
								<v-select
									id="sword-select"
									v-model="swordIds"
									:items="swordSelectItems"
									label="強化したい刀剣男士（複数選択可）"
									multiple chips closable-chips clearable
									variant="outlined" density="comfortable"
									hide-details
									class="mb-4"
								></v-select>

								<!-- 刀剣男士ごとの強化段階（複数選択可。素材が未判明の段階は押せない） -->
								<div v-for="s in swordStageRows" :key="s.id" class="mb-4">
									<div class="field-label">{{ swordLabel(s.id) }}の強化段階</div>
									<v-btn-toggle v-model="swordStageSel[s.id]" multiple divided density="compact"
										variant="outlined" color="primary" class="filter-toggle stage-toggle">
										<v-btn v-for="st in s.stages" :key="st.key" :value="st.key" :disabled="st.pending">
											<span class="stage-label">{{ st.label }}<span v-if="st.pending" class="stage-pending">(調査中)</span></span>
										</v-btn>
									</v-btn-toggle>
								</div>
							</div>

							<!-- 目標アイテムごとの必要数量（アイテムタブの目標＋刀剣男士由来のアイテムを合算） -->
							<div v-if="targetRows.length" class="mb-4">
								<div class="field-label">必要数量</div>
								<div v-for="r in targetRows" :key="r.id" class="inventory-row">
									<label class="inventory-name" :for="'qty-' + r.id">
										{{ nameOf(r.id) }}
										<!-- 刀剣男士由来の分があるときは内訳を出す -->
										<span v-if="r.swordQty > 0" class="target-breakdown">
											<span v-if="r.inItemTab" class="breakdown-part">アイテム {{ fmt(r.itemQty) }}</span><span v-for="(p, i) in r.parts" :key="p.swordId" class="breakdown-part">{{ (r.inItemTab || i > 0) ? '＋ ' : '' }}{{ swordLabel(p.swordId) }} {{ fmt(p.qty) }}</span>
											<span v-if="r.overridden" class="target-override">
												手入力中（合算 {{ fmt(r.autoQty) }}）
												<a href="#" class="target-reset" @click.prevent="onResetTargetQty(r.id)">合算に戻す</a>
											</span>
										</span>
									</label>
									<v-text-field
										:id="'qty-' + r.id"
										class="inventory-input"
										:model-value="r.text"
										@update:model-value="onTargetQtyInput(r, $event)"
										type="number" min="0" step="1" inputmode="numeric"
										suffix="個"
										variant="outlined" density="compact"
										hide-details="auto"
										:rules="[qtyRule]"
										@keyup.enter="onCalculate"
									></v-text-field>
								</div>
								<p v-if="targetRows.some((r) => r.swordQty > 0)" class="note mt-2 mb-0">
									刀剣男士の分がある行の合計は書き換えられます。刀剣男士や強化段階の選択を変えると、書き換えた値は解除されて合算値に戻ります。
								</p>
							</div>

							<v-btn block color="accent" size="large" class="mt-1 font-weight-bold"
								prepend-icon="mdi-calculator-variant-outline"
								:disabled="!canCalculate"
								@click="onCalculate">計算</v-btn>
						</v-card-text>
					</v-card>

					<!-- 所持数（共通部品 components/parts/inventory-card.vue。絞り込み・「あとN」はこのページ固有） -->
					<inventory-card id="inventory-card" :rows="inventoryRows" :inputs="inventoryInputs"
						v-model:search="inventorySearch" @input="onInventoryInput">
						<template #filter>
							<v-btn-toggle v-model="inventoryFilter" mandatory divided density="compact"
								variant="outlined" color="primary" class="filter-toggle mb-3">
								<v-btn value="all">すべて</v-btn>
								<v-btn v-if="showNonzeroFilter" value="nonzero">0以外</v-btn>
								<v-btn value="short" :disabled="!result">不足中</v-btn>
								<v-btn value="sortie" :disabled="!sortieCode">出陣中</v-btn>
							</v-btn-toggle>

							<div v-if="inventoryFilter === 'sortie' && sortieCode" class="sortie-caption mb-2">
								<v-icon icon="mdi-flag-variant" size="small" class="mr-1"></v-icon>
								出陣中: {{ sortieCode }} {{ sortieName }}（ドロップする可能性のあるアイテム）
							</div>
						</template>
						<template #name-suffix="{ item: it }"><span v-if="needOf(it.id) > 0" class="inventory-need">あと{{ fmt(needOf(it.id)) }}</span></template>
					</inventory-card>
				</v-col>

				<!-- ===== 右列：計算結果・推奨アドレス ===== -->
				<v-col cols="12" md="7" lg="8">

					<!-- 計算結果 -->
					<v-card id="result-card" class="mb-4" border flat>
						<v-card-title class="section-title pt-4">計算結果</v-card-title>
						<v-card-text>
							<div v-if="!result" class="muted">目標のアイテムと数量を設定して「計算」を押してください。</div>
							<template v-else>
								<v-alert v-if="isStale" type="info" variant="tonal" density="compact" class="mb-3">
									計算後に入力が変更されています。最新の内容で見るには、もう一度「計算」を押してください。
								</v-alert>

								<!-- 目標が複数のときだけタブを表示（全て / 目標アイテムごと） -->
								<v-tabs v-if="result.targets.length > 1" v-model="resultTab" show-arrows density="compact" hide-slider class="box-tabs mb-3">
									<v-tab value="all">全て</v-tab>
									<v-tab v-for="t in result.targets" :key="t.id" :value="t.id">{{ nameOf(t.id) }}</v-tab>
								</v-tabs>

								<div class="summary">
									<div v-for="t in resultView.summaries" :key="t.id">
										<template v-if="t.net > 0">
											「{{ nameOf(t.id) }}」を {{ fmt(t.qty) }} 個にするには、
											あと <strong class="num">{{ fmt(t.net) }}</strong> 個
											{{ t.craftable ? '作成' : '入手' }}が必要です。
										</template>
										<template v-else>
											「{{ nameOf(t.id) }}」は目標数量をすでに所持しています。
										</template>
									</div>
								</div>

								<v-alert v-if="resultView.unknownRecipes.length" type="info" variant="tonal" density="compact" class="mb-3"
									title="レシピ調査中のアイテム">
									<div v-for="u in resultView.unknownRecipes" :key="u.id" class="mt-1">{{ nameOf(u.id) }}（あと{{ fmt(u.need) }}個）</div>
									<div class="text-caption mt-2">
										レシピがまだ判明していないため、これらのアイテムに必要な素材は計算に含まれていません。
									</div>
								</v-alert>

								<v-table v-if="resultView.rows.length" density="compact" class="result-table">
									<thead>
										<tr>
											<th>アイテム</th>
											<th class="kind-col">区分</th>
											<th class="text-end">現在所持</th>
											<th class="text-end">総所要量</th>
											<th class="text-end">必要数</th>
										</tr>
									</thead>
									<tbody>
										<tr v-for="r in resultView.rows" :key="r.id"
											:class="{ 'row-done': r.net === 0, 'section-break': r.sectionStart }">
											<td>
												{{ nameOf(r.id) }}
												<span class="kind-inline"><v-chip size="x-small" label variant="tonal" :color="kindColor(r)">{{ kindLabel(r) }}</v-chip></span>
											</td>
											<td class="kind-col"><v-chip size="x-small" label variant="tonal" :color="kindColor(r)">{{ kindLabel(r) }}</v-chip></td>
											<td class="text-end num">{{ fmt(r.stock) }}</td>
											<td class="text-end num">{{ fmt(r.gross) }}</td>
											<td class="text-end num need">{{ fmt(r.net) }}</td>
										</tr>
									</tbody>
								</v-table>
								<p class="note mt-3 mb-0">
									総所要量は、上位のアイテムの「必要数」にBOMの数量を掛けて合計した値です。
									中間品は所持数を差し引いた分だけ材料に展開しています。
									<template v-if="resultTab !== 'all'">
										<br>このタブは「{{ nameOf(resultTab) }}」だけを作る場合の内訳です（所持数はすべてこのアイテムに使える前提）。
										複数の目標で所持数を分け合った結果は「全て」タブで確認してください。
									</template>
								</p>
							</template>
						</v-card-text>
					</v-card>

					<!-- 推奨アドレス -->
					<v-card border flat>
						<v-card-title class="section-title pt-4">推奨マップ</v-card-title>
						<v-card-text>
							<v-alert type="info" variant="tonal" density="compact" class="mb-4" icon="mdi-information-outline">
								<div class="pre-line text-body-2">{{ priorityExplanation }}</div>
							</v-alert>

							<div v-if="!result" class="muted">計算すると、不足している素材を狙えるマップを表示します。</div>
							<template v-else>
								<v-alert v-if="result.unreachable.length" type="info" variant="tonal" density="compact" class="mb-4"
									title="入手できるマップが未登録のアイテム">
									<div v-for="u in result.unreachable" :key="u.id" class="mt-1">{{ nameOf(u.id) }}（あと{{ fmt(u.need) }}個）</div>
									<div class="text-caption mt-2">
										これらのアイテムは、入手できるマップがまだ登録されていないため、推奨マップには含まれていません。
									</div>
								</v-alert>
								<v-alert v-if="result.noDrop.length" type="info" variant="tonal" density="compact" class="mb-4"
									title="マップから入手できないアイテム">
									<div v-for="u in result.noDrop" :key="u.id" class="mt-1">{{ nameOf(u.id) }}（あと{{ fmt(u.need) }}個）</div>
									<div class="text-caption mt-2">
										これらのアイテムは、マップからは入手できないため、推奨マップには含まれていません。
									</div>
								</v-alert>

								<div v-if="!result.shortages.length" class="muted">
									{{ result.unknownRecipes.length ? 'レシピ調査中のアイテムを除き、不足している素材はありません。' : '不足している素材はありません。' }}
								</div>
								<div v-else-if="!result.ranking.length" class="muted">不足している素材を取得できるマップがありません。</div>
								<template v-else>
									<v-table density="compact" class="addr-table">
										<thead>
											<tr>
												<th class="text-end" style="width:4.5em">優先度</th>
												<th>マップ</th>
												<th>狙える不足アイテム</th>
												<th class="text-end">スコア</th>
												<th class="text-center">出陣</th>
											</tr>
										</thead>
										<tbody>
											<tr v-for="a in result.ranking" :key="a.code" :class="{ 'row-sortie': a.code === sortieCode }">
												<td class="text-end rank num">{{ a.rank }}<span v-if="a.tied" class="tie">同順位</span></td>
												<td>
													<div class="addr-code">{{ a.code }}</div>
													<div class="addr-name">{{ a.name }}</div>
												</td>
												<td>
													<div class="chips">
														<v-chip v-for="t in a.targets" :key="t.id" size="small" label
															:color="t.addressCount === 1 ? 'accent' : undefined"
															:variant="t.addressCount === 1 ? 'flat' : 'tonal'">
															{{ nameOf(t.id) }} あと{{ fmt(t.need) }}個<span v-if="t.addressCount === 1" class="only-mark">ここだけ</span>
														</v-chip>
													</div>
													<div v-if="a.missingTargets.length" class="missing-note">
														※{{ a.missingTargets.map(nameOf).join('、') }}の素材は入手できません
													</div>
												</td>
												<td class="text-end">
													<div class="score num">{{ a.scores.total.toFixed(2) }}</div>
													<div class="breakdown num">{{ a.scores.coverage }}種類 / 不足 {{ a.scores.need.toFixed(2) }} / 希少 {{ a.scores.rarity.toFixed(2) }}</div>
												</td>
												<td class="text-center sortie-cell">
													<!-- 出陣中は常に1件だけ。出陣中の行のボタンは押せない -->
													<v-btn size="small" class="font-weight-bold"
														:color="a.code === sortieCode ? 'primary' : 'accent'"
														:variant="a.code === sortieCode ? 'tonal' : 'flat'"
														:disabled="a.code === sortieCode"
														@click="onSortie(a.code)">{{ a.code === sortieCode ? '出陣中' : '出陣' }}</v-btn>
												</td>
											</tr>
										</tbody>
									</v-table>
									<p class="note mt-3 mb-0">
										「ここだけ」が表示された場合は、そのアイテムを取得できるマップが1か所しか登録されていません。そこを回るしかない状態か、マップデータが不足している場合があります。<br>
										スコア = 種類数 × {{ weights.coverage }} + 不足 × {{ weights.need }} + 希少 × {{ weights.rarity }}。
										「不足」は各アイテムの必要数を、不足アイテム全体の最大値で割って合計した値、
										「希少」は各アイテムの取得可能マップ数の逆数の合計です。
									</p>
								</template>
							</template>
						</v-card-text>
					</v-card>
				</v-col>
			</v-row>
		</v-container>
	</v-main>

	<v-snackbar v-model="snackbar.show" :color="snackbar.color" :timeout="snackbar.timeout" location="bottom">
		<span class="pre-line">{{ snackbar.text }}</span>
	</v-snackbar>
</v-app>
</script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://unpkg.com/vue@3.5.43/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.13.3/dist/vuetify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.js"></script>
<!-- calc.html / event.html 共通の設定と処理（TouPuz） -->
<script src="components/common.js"></script>

<!-- ===================================================================
     計算ロジック（DOM・Vue・localStorage に依存しない純粋な処理のみ）
     =================================================================== -->
<script id="calc-logic">
const PuzCalc = (() => {
	'use strict';

	// ---------------------------------------------------------------
	// 定数
	// ---------------------------------------------------------------

	/**
	 * アドレス評価の重み。順位の付け方を変えたいときはここだけを変更する。
	 *   coverage : 同時に狙える不足アイテムの種類数
	 *   need     : 不足数の大きさ（不足アイテム全体の最大不足数で正規化）
	 *   rarity   : 取得できる場所の少なさ（取得可能アドレス数の逆数）
	 */
	const SCORE_WEIGHTS = Object.freeze({
		coverage: 1.0,
		need: 0.5,
		rarity: 1.0,
	});

	/** 同順位判定の丸め桁（浮動小数点の誤差で順位差が付かないようにする） */
	const SCORE_ROUNDING = 1e6;

	// ---------------------------------------------------------------
	// 汎用ヘルパー
	// ---------------------------------------------------------------

	const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
	const isPlainObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

	/** BOM上の子アイテムID一覧（不正な形式なら空配列） */
	function childIdsOf(bom, id) {
		return hasOwn(bom, id) && isPlainObject(bom[id]) ? Object.keys(bom[id]) : [];
	}

	/** BOMに登録されている（=中間品・作成品である）か。レシピが空（調査中）でも true */
	function isCraftable(bom, id) {
		return hasOwn(bom, id) && isPlainObject(bom[id]);
	}

	/** レシピ（材料）が判明しているか。bom.json で {} と書かれた作成品は「調査中」として false */
	function hasKnownRecipe(bom, id) {
		return isCraftable(bom, id) && Object.keys(bom[id]).length > 0;
	}

	// ---------------------------------------------------------------
	// アイテムマスタ
	// ---------------------------------------------------------------

	/** アイテムマスタの検証 */
	function validateItemMaster(items) {
		const errors = [];
		const warnings = [];
		if (!Array.isArray(items)) {
			errors.push('item.json: アイテムマスタが配列ではありません。');
			return { errors, warnings };
		}
		const seen = new Set();
		const duplicated = new Set();
		const emptyText = [];
		const badNoDrop = [];
		const badNoShow = [];
		items.forEach((it, i) => {
			const pos = `item.json の ${i + 1} 番目の要素`;
			if (!isPlainObject(it)) {
				errors.push(`${pos}: オブジェクトではありません。`);
				return;
			}
			const idOk = hasOwn(it, 'id') && typeof it.id === 'string' && it.id !== '';
			if (!hasOwn(it, 'id')) errors.push(`${pos}: id がありません。`);
			else if (!idOk) errors.push(`${pos}: id が空でない文字列ではありません。`);
			if (!hasOwn(it, 'text')) errors.push(`${pos}: text がありません。`);
			else if (typeof it.text !== 'string') errors.push(`${pos}: text が文字列ではありません。`);

			if (idOk) {
				if (seen.has(it.id)) duplicated.add(it.id);
				seen.add(it.id);
				if (typeof it.text === 'string' && it.text.trim() === '') emptyText.push(it.id);
			}
			// no_drop（マップから入手できないアイテムの印）は任意。書くなら true / false
			if (hasOwn(it, 'no_drop') && typeof it.no_drop !== 'boolean') badNoDrop.push(idOk ? it.id : pos);
			// no_show（目標selectに出さないアイテムの印）は任意。書くなら true / false
			if (hasOwn(it, 'no_show') && typeof it.no_show !== 'boolean') badNoShow.push(idOk ? it.id : pos);
		});
		if (duplicated.size) {
			errors.push(`item.json: アイテムIDが重複しています:\n${[...duplicated].join('\n')}`);
		}
		if (emptyText.length) {
			warnings.push(`item.json: 名称（text）が空のアイテムがあります。目標の選択肢と所持数の一覧には表示しません:\n${emptyText.join('\n')}`);
		}
		if (badNoDrop.length) {
			warnings.push(`item.json: no_drop が true / false ではないアイテムがあります。マップから入手できないアイテムとしては扱いません:\n${badNoDrop.join('\n')}`);
		}
		if (badNoShow.length) {
			warnings.push(`item.json: no_show が true / false ではないアイテムがあります。目標の選択肢には表示します:\n${badNoShow.join('\n')}`);
		}
		return { errors, warnings };
	}

	/** マップから入手できないアイテム（item.json で no_drop: true）のIDの集合 */
	function buildNoDropSet(items) {
		return new Set(items.filter((it) => it.no_drop === true).map((it) => it.id));
	}

	/** 目標selectに出さないアイテム（item.json で no_show: true）のIDの集合 */
	function buildNoShowSet(items) {
		return new Set(items.filter((it) => it.no_show === true).map((it) => it.id));
	}

	/** アイテムID → アイテム名 のインデックスを作成 */
	function buildItemNameMap(items) {
		return new Map(items.map((it) => [it.id, it.text]));
	}

	/** アイテムID → アイテムマスタ上の並び順 のインデックスを作成（表示順・決定的な処理順に使用） */
	function buildItemOrderMap(items) {
		return new Map(items.map((it, i) => [it.id, i]));
	}

	// ---------------------------------------------------------------
	// BOM
	// ---------------------------------------------------------------

	/**
	 * BOMの循環参照を検出する（再帰を使わない反復DFS）。
	 * 循環があれば [a, b, c, a] のような経路を返し、なければ null を返す。
	 */
	function detectBomCycle(bom) {
		const VISITING = 1;
		const DONE = 2;
		const state = new Map();
		for (const start of Object.keys(bom)) {
			if (state.has(start)) continue;
			// スタックの各要素: [アイテムID, 子アイテムID一覧, 次に調べる子の位置]
			const stack = [[start, childIdsOf(bom, start), 0]];
			state.set(start, VISITING);
			while (stack.length) {
				const frame = stack[stack.length - 1];
				const [node, children] = frame;
				if (frame[2] < children.length) {
					const child = children[frame[2]++];
					const s = state.get(child);
					if (s === VISITING) {
						// 探索中の経路上に戻ってきた = 循環
						const path = stack.map((f) => f[0]);
						return path.slice(path.indexOf(child)).concat(child);
					}
					if (s === undefined) {
						state.set(child, VISITING);
						stack.push([child, childIdsOf(bom, child), 0]);
					}
				} else {
					state.set(node, DONE);
					stack.pop();
				}
			}
		}
		return null;
	}

	/** BOM表の検証 */
	function validateBom(bom, nameMap) {
		const errors = [];
		const warnings = [];
		const label = (id) => (nameMap.get(id) ? `${nameMap.get(id)}` : id);

		if (!isPlainObject(bom)) {
			errors.push('bom.json: BOM表がオブジェクトではありません。');
			return { errors, warnings };
		}
		const unknownIds = new Set();
		const nonInteger = [];
		for (const [parent, children] of Object.entries(bom)) {
			if (!nameMap.has(parent)) unknownIds.add(parent);
			if (!isPlainObject(children)) {
				errors.push(`bom.json: 「${label(parent)}」の子アイテム一覧がオブジェクトではありません。`);
				continue;
			}
			const entries = Object.entries(children); // 空（{}）は「調査中」として正常扱い
			for (const [child, qty] of entries) {
				if (!nameMap.has(child)) unknownIds.add(child);
				if (typeof qty !== 'number' || !Number.isFinite(qty) || qty <= 0) {
					errors.push(`bom.json: 「${label(parent)}」→「${label(child)}」の数量が不正です（${JSON.stringify(qty)}）。0より大きい数値にしてください。`);
				} else if (!Number.isInteger(qty)) {
					nonInteger.push(`${label(parent)} → ${label(child)}: ${qty}`);
				}
			}
		}
		if (unknownIds.size) {
			errors.push(`bom.json: アイテムマスタに存在しないIDがあります:\n${[...unknownIds].join('\n')}`);
		}
		const cycle = detectBomCycle(bom);
		if (cycle) {
			errors.push(`bom.json: BOMに循環参照があります:\n${cycle.map(label).join(' → ')}`);
		}
		if (nonInteger.length) {
			warnings.push(`bom.json: 数量が整数ではない箇所があります（計算は小数のまま行います）:\n${nonInteger.join('\n')}`);
		}
		return { errors, warnings };
	}

	/**
	 * BOMのトポロジカルソート（Kahn法）。親が必ず子より前に並ぶ。
	 * 同じ段階のアイテムはアイテムマスタ順に並べ、結果を決定的にする。
	 * 循環がある場合は例外を投げる（事前に detectBomCycle で弾いている前提）。
	 */
	function topologicalSort(bom, orderMap) {
		const nodes = new Set();
		const indegree = new Map();
		for (const parent of Object.keys(bom)) {
			nodes.add(parent);
			for (const child of childIdsOf(bom, parent)) {
				nodes.add(child);
				indegree.set(child, (indegree.get(child) || 0) + 1);
			}
		}
		const rank = (id) => (orderMap.has(id) ? orderMap.get(id) : Number.MAX_SAFE_INTEGER);
		const byMasterOrder = (a, b) => rank(a) - rank(b);
		const ready = [...nodes].filter((id) => !indegree.get(id)).sort(byMasterOrder);
		const order = [];
		while (ready.length) {
			const id = ready.shift();
			order.push(id);
			let added = false;
			for (const child of childIdsOf(bom, id)) {
				const d = indegree.get(child) - 1;
				indegree.set(child, d);
				if (d === 0) { ready.push(child); added = true; }
			}
			if (added) ready.sort(byMasterOrder);
		}
		if (order.length !== nodes.size) {
			throw new Error('BOMに循環参照があるため、並べ替えできません。');
		}
		return order;
	}

	/** 目標アイテムからBOMをたどって到達できるアイテムの集合 */
	function collectReachable(bom, targetId) {
		const seen = new Set([targetId]);
		const stack = [targetId];
		while (stack.length) {
			const id = stack.pop();
			for (const child of childIdsOf(bom, id)) {
				if (!seen.has(child)) { seen.add(child); stack.push(child); }
			}
		}
		return seen;
	}

	/** 正味所要量 = max(0, 総所要量 - 現在所持数) */
	function calculateNetRequirement(gross, stock) {
		return Math.max(0, gross - stock);
	}

	/**
	 * BOMの所要量計算（決定論的・厳密）。
	 * トポロジカル順（親→子）に処理するため、あるアイテムを処理する時点で
	 * すべての経路からの需要が合算済みになっており、在庫は1回だけ差し引かれる。
	 * 中間品は「正味所要量」の分だけ下位へ展開する。
	 * 目標は複数指定できる（targets: [{ id, qty }]）。目標どうしが材料関係にある場合も需要は合算される。
	 * 互換のため、単一目標の targetId / targetQty 指定も受け付ける。
	 *
	 * 戻り値: [{ id, kind, craftable, recipeKnown, gross, stock, net }]（トポロジカル順）
	 *   kind: 'target' | 'intermediate' | 'terminal'
	 *   recipeKnown: 作成品のうちレシピが判明しているか（調査中の作成品は材料に展開しない）
	 */
	function calculateRequirements({ bom, topoOrder, targets, targetId, targetQty, inventory }) {
		const list = targets || [{ id: targetId, qty: targetQty }];
		const targetSet = new Set(list.map((t) => t.id));
		const stockOf = (id) => {
			const v = inventory && hasOwn(inventory, id) ? inventory[id] : 0;
			return Number.isFinite(v) && v > 0 ? v : 0;
		};
		const reachable = new Set();
		for (const t of list) for (const id of collectReachable(bom, t.id)) reachable.add(id);
		const order = topoOrder.filter((id) => reachable.has(id));
		// BOMに一切登場しないアイテムを目標にした場合は先頭に置く（親を持たないので順序は崩れない）
		const missing = [...targetSet].filter((id) => !order.includes(id));
		order.unshift(...missing);

		const gross = new Map();
		for (const t of list) gross.set(t.id, (gross.get(t.id) || 0) + t.qty);
		const rows = [];
		for (const id of order) {
			const g = gross.get(id) || 0;
			if (g <= 0 && !targetSet.has(id)) continue; // 需要が発生しなかったアイテムは表示しない
			const craftable = isCraftable(bom, id);
			const stock = stockOf(id);
			const net = calculateNetRequirement(g, stock);
			rows.push({
				id,
				kind: targetSet.has(id) ? 'target' : (craftable ? 'intermediate' : 'terminal'),
				craftable,
				recipeKnown: hasKnownRecipe(bom, id),
				gross: g,
				stock,
				net,
			});
			if (craftable && net > 0) {
				for (const [child, qty] of Object.entries(bom[id])) {
					gross.set(child, (gross.get(child) || 0) + net * qty);
				}
			}
		}
		return rows;
	}

	/**
	 * 計算結果の表示順を決める。
	 *   1. 目標アイテム（目標 select の順）
	 *   2. 目標の直接の材料（bom.json に書かれた順。中間品・素材の区別なく、ゲームの表示と同じ並び）
	 *      目標が複数のときは、1つ目の目標の材料 → 2つ目の目標の材料 … の順（重複は最初の位置）
	 *   3. さらに分解して出てきたアイテム（item.json に書かれた順）
	 * targetIds は ID 1つ、または ID の配列。
	 */
	function sortRequirementRows(rows, bom, targetIds, orderMap) {
		const targets = Array.isArray(targetIds) ? targetIds : [targetIds];
		const targetIndex = new Map(targets.map((id, i) => [id, i]));
		const directIndex = new Map();
		for (const t of targets) {
			for (const id of childIdsOf(bom, t)) {
				if (!targetIndex.has(id) && !directIndex.has(id)) directIndex.set(id, directIndex.size);
			}
		}
		const groupOf = (id) => (targetIndex.has(id) ? 0 : directIndex.has(id) ? 1 : 2);
		const masterRank = (id) => (orderMap.has(id) ? orderMap.get(id) : Number.MAX_SAFE_INTEGER);
		const SECTION = ['target', 'direct', 'expanded'];
		const sorted = [...rows].sort((a, b) => {
			const ga = groupOf(a.id);
			const gb = groupOf(b.id);
			if (ga !== gb) return ga - gb;
			if (ga === 0) return targetIndex.get(a.id) - targetIndex.get(b.id);
			if (ga === 1) return directIndex.get(a.id) - directIndex.get(b.id);
			return masterRank(a.id) - masterRank(b.id);
		});
		// section: 表示上の区切り（target=目標 / direct=bom.json記載の材料 / expanded=分解して出てきたアイテム）
		// sectionStart: 直前の行と区切りが変わる最初の行か（境界線の描画に使う）
		return sorted.map((r, i) => {
			const section = SECTION[groupOf(r.id)];
			const prev = i > 0 ? SECTION[groupOf(sorted[i - 1].id)] : null;
			return { ...r, section, sectionStart: prev !== null && prev !== section };
		});
	}

	/**
	 * 不足アイテムの抽出。
	 * アドレスで集める対象は「BOMでこれ以上展開しないアイテム（末端品）」の不足分のみ。
	 * 中間品の不足は材料へ展開済みなので、ここでは重複して数えない。
	 */
	function extractShortages(rows) {
		return rows
			.filter((r) => r.net > 0 && !r.craftable)
			.map((r) => ({ id: r.id, need: r.net }));
	}

	/**
	 * 調査中のため材料を計算できない作成品（不足分があるもの）の抽出。
	 * これらはマップで集める対象でもないため、推奨マップにも含まれない。
	 */
	function extractUnknownRecipes(rows) {
		return rows
			.filter((r) => r.net > 0 && r.craftable && !r.recipeKnown)
			.map((r) => ({ id: r.id, need: r.net }));
	}

	// ---------------------------------------------------------------
	// アドレス表
	// ---------------------------------------------------------------

	/**
	 * アドレス表の検証と正規化。
	 * 値は { name, drop: [...] } 形式、またはアイテムID配列のみの形式を受け付ける。
	 * 同一アドレス内の重複IDは除去する。
	 * 戻り値の table は { アドレス: { name, drop: [重複なしのアイテムID] } }（元の並び順を保持）。
	 */
	function validateAddressTable(map, nameMap) {
		const errors = [];
		const warnings = [];
		const table = {};
		if (!isPlainObject(map)) {
			errors.push('map.json: マップ表がオブジェクトではありません。');
			return { errors, warnings, table };
		}
		const unknownIds = new Set();
		const dedupedAddresses = [];
		for (const [code, value] of Object.entries(map)) {
			let name = '';
			let drop;
			if (Array.isArray(value)) {
				drop = value;
			} else if (isPlainObject(value) && Array.isArray(value.drop)) {
				drop = value.drop;
				if (hasOwn(value, 'name')) {
					if (typeof value.name === 'string') name = value.name;
					else errors.push(`map.json: マップ「${code}」の name が文字列ではありません。`);
				}
			} else {
				errors.push(`map.json: マップ「${code}」の取得アイテム一覧（drop）が配列ではありません。`);
				continue;
			}
			const unique = [];
			const seen = new Set();
			let hadDuplicate = false;
			for (const id of drop) {
				if (typeof id !== 'string') {
					errors.push(`map.json: マップ「${code}」に文字列ではないアイテムIDがあります（${JSON.stringify(id)}）。`);
					continue;
				}
				if (!nameMap.has(id)) unknownIds.add(id);
				if (seen.has(id)) { hadDuplicate = true; continue; }
				seen.add(id);
				unique.push(id);
			}
			if (hadDuplicate) dedupedAddresses.push(code);
			table[code] = { name, drop: unique };
		}
		if (unknownIds.size) {
			errors.push(`map.json: アイテムマスタに存在しないIDがあります:\n${[...unknownIds].join('\n')}`);
		}
		if (dedupedAddresses.length) {
			warnings.push(`map.json: 同じマップ内で重複していたアイテムIDを1つにまとめました:\n${dedupedAddresses.join('\n')}`);
		}
		return { errors, warnings, table };
	}

	/** アイテムID → そのアイテムを取得できるアドレス数 を集計 */
	function buildItemAddressCounts(table) {
		const counts = new Map();
		for (const entry of Object.values(table)) {
			for (const id of entry.drop) counts.set(id, (counts.get(id) || 0) + 1);
		}
		return counts;
	}

	/** 不足しているが、どのアドレスからも取得できないアイテム */
	function findUnreachableShortages(shortages, addressCounts) {
		return shortages.filter((s) => !addressCounts.get(s.id));
	}

	/**
	 * どのマップからも取得できない不足アイテムを、理由ごとに分ける。
	 * noDrop      : マップから入手できないアイテム（item.json で no_drop: true）
	 * unregistered: 入手できるマップが map.json に未登録のアイテム
	 */
	function splitUnreachableShortages(unreachable, noDropIds) {
		return {
			noDrop: unreachable.filter((s) => noDropIds.has(s.id)),
			unregistered: unreachable.filter((s) => !noDropIds.has(s.id)),
		};
	}

	// ---------------------------------------------------------------
	// アドレス推薦（ヒューリスティック。取得確率は一切使わない）
	// ---------------------------------------------------------------

	/**
	 * 1アドレスのスコア計算。
	 * targets: そのアドレスで狙える不足アイテム [{ id, need, addressCount }]
	 * maxNeed: 不足アイテム全体の中での最大不足数（正規化用）
	 */
	function calculateAddressScore(targets, maxNeed, weights = SCORE_WEIGHTS) {
		const coverage = targets.length;
		const need = targets.reduce((sum, t) => sum + (maxNeed > 0 ? t.need / maxNeed : 0), 0);
		const rarity = targets.reduce((sum, t) => sum + (t.addressCount > 0 ? 1 / t.addressCount : 0), 0);
		const total = weights.coverage * coverage + weights.need * need + weights.rarity * rarity;
		return { coverage, need, rarity, total };
	}

	/**
	 * 全アドレスのスコア計算。
	 * 不足数0のアイテムは評価に含めず、不足アイテムを1つも狙えないアドレスは結果から除外する。
	 */
	function calculateAddressScores({ table, shortages, addressCounts, orderMap, weights = SCORE_WEIGHTS }) {
		const needMap = new Map(shortages.map((s) => [s.id, s.need]));
		const maxNeed = shortages.reduce((m, s) => Math.max(m, s.need), 0);
		const rank = (id) => (orderMap && orderMap.has(id) ? orderMap.get(id) : Number.MAX_SAFE_INTEGER);
		const results = [];
		Object.entries(table).forEach(([code, entry], index) => {
			const targets = entry.drop
				.filter((id) => needMap.has(id))
				.map((id) => ({ id, need: needMap.get(id), addressCount: addressCounts.get(id) || 0 }));
			if (!targets.length) return;
			// 表示順: 取得場所の少ないアイテムを先に、同じならアイテムマスタ順
			targets.sort((a, b) => a.addressCount - b.addressCount || rank(a.id) - rank(b.id));
			results.push({
				code,
				name: entry.name,
				index,
				targets,
				scores: calculateAddressScore(targets, maxNeed, weights),
			});
		});
		return results;
	}

	/**
	 * スコアの高い順に並べ、順位を付ける。
	 * スコアが同じアドレスは同順位（1, 1, 3 … の形式）とし、無理に差を付けない。
	 * 同順位内の並びはアドレス表の記載順。
	 */
	function rankAddresses(scored) {
		const keyOf = (a) => Math.round(a.scores.total * SCORE_ROUNDING);
		const sorted = [...scored].sort((a, b) => keyOf(b) - keyOf(a) || a.index - b.index);
		const keyCount = new Map();
		for (const a of sorted) keyCount.set(keyOf(a), (keyCount.get(keyOf(a)) || 0) + 1);
		let prevKey = null;
		let prevRank = 0;
		return sorted.map((a, i) => {
			const key = keyOf(a);
			const rank = key === prevKey ? prevRank : i + 1;
			prevKey = key;
			prevRank = rank;
			return { ...a, rank, tied: keyCount.get(key) > 1 };
		});
	}

	/**
	 * 目標が複数のとき、各マップで「どの目標の素材も1つも入手できないか」を調べて注記を付ける。
	 * ranking   : rankAddresses の結果
	 * table     : マップ表
	 * targetMaterials: [{ id: 目標ID, materials: Set(その目標に関係する不足素材ID) }]
	 *   materials が空の目標（不足なし・入手先が未登録のみ 等）は注記の対象外
	 * 戻り値: 各要素に missingTargets（目標IDの配列）を加えた ranking
	 */
	function annotateMissingTargets(ranking, table, targetMaterials) {
		const active = targetMaterials.filter((t) => t.materials.size > 0);
		return ranking.map((a) => {
			const drops = new Set((table[a.code] && table[a.code].drop) || []);
			const missingTargets = active
				.filter((t) => ![...t.materials].some((id) => drops.has(id)))
				.map((t) => t.id);
			return { ...a, missingTargets };
		});
	}

	// ---------------------------------------------------------------
	// 刀剣男士レシピ（強化段階ごとに必要なアイテム）
	// ---------------------------------------------------------------

	/** 強化段階（sword_recipe.json の stages のキーと、画面での表示）。この順で表示・合算する */
	const SWORD_STAGES = Object.freeze([
		Object.freeze({ key: '10-20', label: '10→20' }),
		Object.freeze({ key: '20-30', label: '20→30' }),
		Object.freeze({ key: '30-35', label: '30→35' }),
	]);

	/**
	 * 刀剣男士マスタ（sword.json）の検証。
	 * 各要素は { id: 刀剣男士ID, name: 名前（表示名としてそのまま使う） }。並び順が刀剣男士selectの表示順になる。
	 */
	function validateSwordMaster(list) {
		const errors = [];
		const warnings = [];
		if (!Array.isArray(list)) {
			errors.push('sword.json: 刀剣男士マスタが配列ではありません。');
			return { errors, warnings };
		}
		const seen = new Set();
		const duplicated = new Set();
		list.forEach((sw, i) => {
			const pos = `sword.json の ${i + 1} 番目の要素`;
			if (!isPlainObject(sw)) {
				errors.push(`${pos}: オブジェクトではありません。`);
				return;
			}
			if (typeof sw.id !== 'string' || sw.id === '') errors.push(`${pos}: id が空でない文字列ではありません。`);
			else {
				if (seen.has(sw.id)) duplicated.add(sw.id);
				seen.add(sw.id);
			}
			if (typeof sw.name !== 'string' || sw.name.trim() === '') errors.push(`${pos}: name が空でない文字列ではありません。`);
		});
		if (duplicated.size) {
			errors.push(`sword.json: 刀剣男士IDが重複しています:\n${[...duplicated].join('\n')}`);
		}
		return { errors, warnings };
	}

	/**
	 * 刀剣男士レシピ（sword_recipe.json）の検証。
	 * 各要素は { id: 刀剣男士ID, stages: { 段階キー: null または { アイテムID: 数量 } } }。
	 * 段階の値は null（素材が未判明＝調査中）か、{ アイテムID: 数量 } のオブジェクト。
	 * stages に書かれていない段階、レシピ自体がない刀剣男士も調査中として扱う。
	 * swordNames: 刀剣男士ID → 名前（エラー表示用。マスタにないIDの検出にも使う）
	 */
	function validateSwordRecipes(list, nameMap, swordNames) {
		const errors = [];
		const warnings = [];
		if (!Array.isArray(list)) {
			errors.push('sword_recipe.json: 刀剣男士レシピが配列ではありません。');
			return { errors, warnings };
		}
		const stageKeys = new Set(SWORD_STAGES.map((s) => s.key));
		const seen = new Set();
		const duplicated = new Set();
		const unknownItemIds = new Set();
		const unknownSwordIds = new Set();
		list.forEach((rc, i) => {
			const pos = `sword_recipe.json の ${i + 1} 番目の要素`;
			if (!isPlainObject(rc)) {
				errors.push(`${pos}: オブジェクトではありません。`);
				return;
			}
			if (typeof rc.id !== 'string' || rc.id === '') errors.push(`${pos}: id が空でない文字列ではありません。`);
			else {
				if (seen.has(rc.id)) duplicated.add(rc.id);
				seen.add(rc.id);
				if (!swordNames.has(rc.id)) unknownSwordIds.add(rc.id);
			}
			if (!isPlainObject(rc.stages)) {
				errors.push(`${pos}: stages がオブジェクトではありません。`);
				return;
			}
			const label = swordNames.get(rc.id) || (typeof rc.id === 'string' && rc.id) || pos;
			for (const [stage, items] of Object.entries(rc.stages)) {
				if (!stageKeys.has(stage)) {
					errors.push(`sword_recipe.json: 「${label}」に不明な強化段階があります（${stage}）。`);
					continue;
				}
				if (items === null) continue; // 調査中
				if (!isPlainObject(items)) {
					errors.push(`sword_recipe.json: 「${label}」の ${stage} が null でもオブジェクトでもありません。`);
					continue;
				}
				for (const [id, qty] of Object.entries(items)) {
					if (!nameMap.has(id)) unknownItemIds.add(id);
					if (!Number.isSafeInteger(qty) || qty <= 0) {
						errors.push(`sword_recipe.json: 「${label}」の ${stage} →「${nameMap.get(id) || id}」の数量が不正です（${JSON.stringify(qty)}）。1以上の整数にしてください。`);
					}
				}
			}
		});
		if (duplicated.size) {
			errors.push(`sword_recipe.json: 刀剣男士IDが重複しています:\n${[...duplicated].join('\n')}`);
		}
		if (unknownSwordIds.size) {
			errors.push(`sword_recipe.json: 刀剣男士マスタ（sword.json）に存在しないIDがあります:\n${[...unknownSwordIds].join('\n')}`);
		}
		if (unknownItemIds.size) {
			errors.push(`sword_recipe.json: アイテムマスタに存在しないIDがあります:\n${[...unknownItemIds].join('\n')}`);
		}
		return { errors, warnings };
	}

	/**
	 * 刀剣男士マスタとレシピを、画面で使う1人分の形 { id, name, stages } にまとめる。
	 * 並びはマスタ（sword.json）の順。レシピがない刀剣男士は stages を空（全段階が調査中）にする。
	 * どちらも検証済みである前提。
	 */
	function buildSwords(masterList, recipeList) {
		const stagesById = new Map(recipeList.map((rc) => [rc.id, rc.stages]));
		return masterList.map((sw) => ({
			id: sw.id,
			name: sw.name,
			stages: stagesById.get(sw.id) || {},
		}));
	}

	/** 強化段階の素材が判明しているか（null・未記載・空オブジェクトは調査中） */
	function hasKnownSwordStage(sword, stageKey) {
		const items = sword && isPlainObject(sword.stages) ? sword.stages[stageKey] : null;
		return isPlainObject(items) && Object.keys(items).length > 0;
	}

	/**
	 * ID の配列を、rankMap（ID → 表示順）の順に並べ替えた新しい配列を返す。
	 * 選んだ順ではなく、選択肢（v-select）と同じ並びで表示するために使う。
	 * rankMap にない ID は末尾（元の並びのまま）。
	 */
	function sortIdsByRank(ids, rankMap) {
		const rank = (id) => (rankMap.has(id) ? rankMap.get(id) : Number.MAX_SAFE_INTEGER);
		return [...ids].sort((a, b) => rank(a) - rank(b));
	}

	/**
	 * 選んだ刀剣男士×強化段階で必要なアイテムを合算する。
	 * swords    : 刀剣男士ID → レシピ の Map
	 * selections: [{ id: 刀剣男士ID, stages: [段階キー] }]（この並びで合算する。画面からは sword.json の順で渡す）
	 * 戻り値: [{ id: アイテムID, qty: 合計, parts: [{ swordId, qty }] }]
	 *   並びは、selections の順 → 段階順（SWORD_STAGES）→ レシピの記載順 で最初に出てきた順
	 */
	function sumSwordStageItems(swords, selections) {
		const byItem = new Map();
		for (const sel of selections) {
			const sw = swords.get(sel.id);
			if (!sw) continue;
			for (const { key } of SWORD_STAGES) {
				if (!sel.stages.includes(key) || !hasKnownSwordStage(sw, key)) continue;
				for (const [id, qty] of Object.entries(sw.stages[key])) {
					if (!byItem.has(id)) byItem.set(id, { id, qty: 0, parts: [] });
					const row = byItem.get(id);
					row.qty += qty;
					const part = row.parts.find((p) => p.swordId === sel.id);
					if (part) part.qty += qty;
					else row.parts.push({ swordId: sel.id, qty });
				}
			}
		}
		return [...byItem.values()];
	}

	// 所持数データの整理（sanitizeInventory）は event.html と共通のため components/common.js にある

	return {
		SCORE_WEIGHTS,
		validateItemMaster,
		buildItemNameMap,
		buildItemOrderMap,
		buildNoDropSet,
		buildNoShowSet,
		validateBom,
		detectBomCycle,
		topologicalSort,
		collectReachable,
		calculateNetRequirement,
		calculateRequirements,
		sortRequirementRows,
		extractShortages,
		validateAddressTable,
		buildItemAddressCounts,
		findUnreachableShortages,
		splitUnreachableShortages,
		calculateAddressScore,
		calculateAddressScores,
		rankAddresses,
		annotateMissingTargets,
		isCraftable,
		hasKnownRecipe,
		extractUnknownRecipes,
		SWORD_STAGES,
		validateSwordMaster,
		validateSwordRecipes,
		buildSwords,
		hasKnownSwordStage,
		sortIdsByRank,
		sumSwordStageItems,
	};
})();

// Node.js からテストするための書き出し（ブラウザでは何もしない）
if (typeof module !== 'undefined' && module.exports) module.exports = PuzCalc;
</script>

			};

			// 刀剣男士selectの項目（どの段階も調査中の刀剣男士は選べない）
			const swordSelectItems = computed(() => master.value.swords.map((sw) => {
				const known = PuzCalc.SWORD_STAGES.some((s) => PuzCalc.hasKnownSwordStage(sw, s.key));
				return {
					title: known ? swordLabel(sw.id) : `${swordLabel(sw.id)}(調査中)`,
					value: sw.id,
					props: { disabled: !known },
				};
			}));

			// 選んだ刀剣男士ID（選んだ順ではなく、刀剣男士selectと同じ sword.json の順）
			const orderedSwordIds = computed(() => PuzCalc.sortIdsByRank(
				swordIds.value,
				new Map(master.value.swords.map((sw, i) => [sw.id, i])),
			));

			// 選んだ刀剣男士ごとの強化段階ボタン（素材が未判明の段階は調査中として押せない）
			const swordStageRows = computed(() => orderedSwordIds.value.map((id) => {
				const sw = master.value.swordMap.get(id);
				return {
					id,
					stages: PuzCalc.SWORD_STAGES.map((s) => ({
						...s,
						pending: !PuzCalc.hasKnownSwordStage(sw, s.key),
					})),
				};
			}));

			// 選んだ刀剣男士×段階で必要なアイテムの合算（アイテムID → { qty, parts }）
			const swordItems = computed(() => PuzCalc.sumSwordStageItems(
				master.value.swordMap,
				orderedSwordIds.value.map((id) => ({ id, stages: swordStageSel[id] || [] })),
			));

			// 目標selectの項目（item.json の並び順そのまま。ゲーム内の並びと合わせてある）
			// 調査中の作成品（レシピが {}）は選択肢には出すが、選べないようにする
			// item.json で no_show: true のアイテムは選択肢に出さない
			const targetSelectItems = computed(() => {
				const { items, bom, noShowIds } = master.value;
				return items.filter((it) => !noShowIds.has(it.id)).map((it) => {
					const pending = PuzCalc.isCraftable(bom, it.id) && !PuzCalc.hasKnownRecipe(bom, it.id);
					return {
						title: pending ? `${it.text}(調査中)` : it.text,
						value: it.id,
						props: { disabled: pending },
					};
				});
			});

			// 目標selectでの並び順（アイテムID → 何番目か）
			const targetSelectRank = computed(() => new Map(
				targetSelectItems.value.map((x, i) => [x.value, i]),
			));

			/**
			 * 必要数量の行（アイテムタブの目標と、刀剣男士由来のアイテムを合算して1アイテム1行）。
			 * 並び: アイテムタブで選んだアイテム（目標selectと同じ順）→ 刀剣男士由来だけのアイテム（sumSwordStageItems の順）
			 * 計算結果のタブ・目標ごとの文言・結果表の目標行も、この並びになる
			 *   itemText : アイテムタブ側の数量の入力文字列（アイテムタブで選んでいないときは null）
			 *   swordQty : 刀剣男士由来の数量の合計 / parts: その内訳
			 *   key      : 上書き解除の判定に使う「合算の元」
			 *   overridden: 手入力で上書き中か / autoQty: 合算値 / text: 入力欄に表示する文字列
			 */
			const targetRows = computed(() => {
				const swordById = new Map(swordItems.value.map((s) => [s.id, s]));
				const itemIds = PuzCalc.sortIdsByRank(targetIds.value, targetSelectRank.value);
				const ids = [...itemIds, ...swordItems.value.map((s) => s.id).filter((id) => !targetIds.value.includes(id))];
				return ids.map((id) => {
					const inItemTab = targetIds.value.includes(id);
					const itemText = inItemTab ? String(targetQtyInputs[id] ?? '').trim() : null;
					const sw = swordById.get(id);
					const swordQty = sw ? sw.qty : 0;
					const parts = sw ? sw.parts : [];
					if (!swordQty) {
						// 刀剣男士由来の分がない行は、これまでどおりアイテムタブ側の数量をそのまま編集する
						return { id, inItemTab, itemText, swordQty, parts, key: '', overridden: false, autoQty: null, text: itemText };
					}
					// アイテム分が空・不正のときは 0 として合算する
					const itemQty = inItemTab && isNonNegativeIntegerText(itemText) ? Number(itemText) : 0;
					const autoQty = itemQty + swordQty;
					const key = `${inItemTab ? itemQty : '-'}+${swordQty}`;
					const ov = targetOverrides[id];
					const overridden = !!ov && ov.key === key;
					return { id, inItemTab, itemText, itemQty, swordQty, parts, key, overridden, autoQty, text: overridden ? ov.text : String(autoQty) };
				});
			});

			// 合算の元が変わった行（刀剣男士・段階の選択変更、アイテムタブでの追加・削除）は上書きを解除する
			watch(targetRows, (rows) => {
				const keyOf = new Map(rows.map((r) => [r.id, r.key]));
				for (const id of Object.keys(targetOverrides)) {
					if (keyOf.get(id) !== targetOverrides[id].key) delete targetOverrides[id];
				}
			});

			/** 必要数量の入力: 刀剣男士由来の分がある行は上書き値として、ない行はアイテムタブ側の数量として保持 */
			function onTargetQtyInput(row, value) {
				const text = value == null ? '' : String(value).trim();
				if (row.swordQty > 0) targetOverrides[row.id] = { text, key: row.key };
				else targetQtyInputs[row.id] = text;
			}

			/** 上書きを解除して合算値に戻す */
			function onResetTargetQty(id) {
				delete targetOverrides[id];
			}

			// 表示中のタブの計算結果
			const resultView = computed(() => {
				if (!result.value) return { rows: [], unknownRecipes: [], summaries: [] };
				return result.value.views[resultTab.value] || result.value.views.all;
			});

			// 計算結果の「あと必要」数（所持数一覧のバッジ・絞り込み用）
			const needMap = computed(() => new Map(result.value ? result.value.rows.map((r) => [r.id, r.net]) : []));
			const needOf = (id) => needMap.value.get(id) || 0;

			// 出陣中のマップの名前と、そこでドロップする可能性のあるアイテム
			const sortieName = computed(() => {
				const e = sortieCode.value && master.value.addressTable[sortieCode.value];
				return e ? e.name : '';
			});
			const sortieDrops = computed(() => {
				const e = sortieCode.value && master.value.addressTable[sortieCode.value];
				return new Set(e ? e.drop : []);
			});

			// 所持数一覧（検索・絞り込み）
			const inventoryRows = computed(() => {
				const matches = TouPuz.itemKeywordMatcher(inventorySearch.value);
				const isSortie = inventoryFilter.value === 'sortie';
				const rows = master.value.items.filter((it) => {
					if (!matches(it)) return false;
					if (inventoryFilter.value === 'nonzero') return (inventory[it.id] || 0) > 0;
					if (inventoryFilter.value === 'short') return needOf(it.id) > 0;
					// 出陣中タブの末尾に置くアイテムは、ドロップに含まれていても下で1行だけ足す
					if (isSortie) return it.id !== SORTIE_TAIL_ITEM_ID && sortieDrops.value.has(it.id);
					return true;
				});
				// 出陣中のマップがあるときは、ドロップ品の後の一番下に表示する（検索条件は他の行と同じく適用）
				if (isSortie && sortieCode.value) {
					const tail = master.value.items.find((it) => it.id === SORTIE_TAIL_ITEM_ID);
					if (tail && matches(tail)) rows.push(tail);
				}
				return rows;
			});

			// 計算後に入力が変わったか
			const currentSignature = () => JSON.stringify([
				targetRows.value.map((r) => [r.id, r.text]),
				inventory,
			]);
			const isStale = computed(() => !!result.value && result.value.signature !== currentSignature());

			// ----- 初期化 -----
			function initialize(rawItems, rawBom, rawMap, rawSwords, rawSwordRecipes) {
				const itemCheck = PuzCalc.validateItemMaster(rawItems);
				const warnings = [...itemCheck.warnings];
				if (itemCheck.errors.length) {
					reportDataProblems(itemCheck.errors, warnings);
					return;
				}
				const nameMap = PuzCalc.buildItemNameMap(rawItems);
				const orderMap = PuzCalc.buildItemOrderMap(rawItems);

				const bomCheck = PuzCalc.validateBom(rawBom, nameMap);
				const mapCheck = PuzCalc.validateAddressTable(rawMap, nameMap);
				// 刀剣男士: マスタ（sword.json）とレシピ（sword_recipe.json）を検証してから1人分の形にまとめる
				const swordMasterCheck = PuzCalc.validateSwordMaster(rawSwords);
				const swordNames = new Map(Array.isArray(rawSwords)
					? rawSwords.filter((sw) => sw && typeof sw.id === 'string').map((sw) => [sw.id, sw.name])
					: []);
				const swordRecipeCheck = PuzCalc.validateSwordRecipes(rawSwordRecipes, nameMap, swordNames);
				const swordErrors = [...swordMasterCheck.errors, ...swordRecipeCheck.errors];
				const swords = swordErrors.length ? [] : PuzCalc.buildSwords(rawSwords, rawSwordRecipes);
				const errors = [...bomCheck.errors, ...mapCheck.errors, ...swordErrors];
				warnings.push(...bomCheck.warnings, ...mapCheck.warnings, ...swordMasterCheck.warnings, ...swordRecipeCheck.warnings);

				const bom = rawBom && typeof rawBom === 'object' && !Array.isArray(rawBom) ? rawBom : {};
				const topoOrder = errors.length ? [] : PuzCalc.topologicalSort(bom, orderMap);

				// マップから入手できないアイテム。map.json にドロップ先があるものは、そちらを優先してマップ評価に含める
				const noDropIds = PuzCalc.buildNoDropSet(rawItems);
				const addressCounts = PuzCalc.buildItemAddressCounts(mapCheck.table);
				const noDropButDropped = [...noDropIds].filter((id) => addressCounts.get(id));
				if (noDropButDropped.length) {
					warnings.push(`item.json で no_drop: true なのに、map.json にドロップ先が登録されているアイテムがあります。推奨マップの評価には含めます:\n${noDropButDropped.map((id) => nameMap.get(id) || id).join('\n')}`);
				}

				master.value = {
					items: rawItems.filter((it) => it.text.trim() !== ''),
					nameMap,
					orderMap,
					bom,
					topoOrder,
					addressTable: mapCheck.table,
					addressCounts,
					noDropIds,
					noShowIds: PuzCalc.buildNoShowSet(rawItems),
					// 刀剣男士（マスタとレシピをまとめたもの。形式に誤りがある場合は使わない）
					swords,
					swordMap: new Map(swords.map((sw) => [sw.id, sw])),
				};
				reportDataProblems(errors, warnings);

				// 所持数の復元（保存がないアイテムは0）
				inventoryState.restore(nameMap, rawItems.map((it) => it.id));

				// 目標は未選択の状態から始める
				ready.value = true;
			}
			const hasValue = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);

			/**
			 * データの問題の出し分け。
			 * 利用者には対処できない内容なので、詳細は開発者向けにコンソールへ出力する。
			 * エラー（計算不可）があるときだけ、画面には「読み込めなかった」旨を表示する。
			 */
			function reportDataProblems(errors, warnings) {
				errors.forEach((msg) => console.error('[データエラー]', msg));
				warnings.forEach((msg) => console.warn('[データの注意]', msg));
				dataErrors.value = errors;
			}

			async function loadAll() {
				try {
					const [rawItems, rawBom, rawMap, rawSwords, rawSwordRecipes] = await Promise.all([
						loadJson(DATA_FILES.items),
						loadJson(DATA_FILES.bom),
						loadJson(DATA_FILES.map),
						loadJson(DATA_FILES.swords),
						loadJson(DATA_FILES.swordRecipes),
					]);
					initialize(rawItems, rawBom, rawMap, rawSwords, rawSwordRecipes);
				} catch (e) {
					const hint = location.protocol === 'file:'
						? '\nファイルを直接開いた場合、ブラウザの制限でJSONを読み込めません。Webサーバーに配置して開いてください。'
						: '\ncalc.html と同じ場所に data フォルダ（item.json / bom.json / map.json / sword.json / sword_recipe.json）があるか確認してください。';
					reportDataProblems([(e && e.message ? e.message : String(e)) + hint], []);
				} finally {
					loading.value = false;
				}
			}

			// ----- イベント -----

			/** 所持数の入力: 正しい値ならすぐ保存。不正な値は保存しない */
			function onInventoryInput(id, value) {
				if (!inventoryState.input(id, value)) {
					showSnack('所持数をブラウザに保存できませんでした。プライベートモードやストレージの設定を確認してください。');
				}
			}

			/**
			 * 別のタブ・別のページで所持数が保存されたら、読み直して表示に反映する。
			 * 読み直さないと、このタブで次に入力したときに古い所持数で上書きしてしまう。
			 */
			window.addEventListener('storage', (e) => {
				if (e.key !== STORAGE_KEY || !ready.value) return;
				inventoryState.reload();
			});

			/** 出陣: 選んだマップを出陣中にし、所持数を「出陣中」タブに切り替える */
			function onSortie(code) {
				sortieCode.value = code;
				inventoryFilter.value = 'sortie';
				inventorySearch.value = '';
				// スマホ幅では所持数が上にあるので、所持数まで戻る
				if (window.innerWidth < 960) {
					nextTick(() => {
						const el = document.getElementById('inventory-card');
						if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
					});
				}
			}

			/** 計算ボタン: 所要量計算 → 不足抽出 → マップ評価 → 順位付け（目標は複数可） */
			function onCalculate() {
				if (!canCalculate.value) return;
				// 必要数量は、アイテムタブの目標と刀剣男士由来のアイテムを合算した値（手入力の上書きを含む）
				const qtyRows = targetRows.value;
				const qtyTexts = qtyRows.map((r) => String(r.text ?? '').trim());
				if (qtyTexts.some((t) => !isNonNegativeIntegerText(t))) {
					showSnack('必要数量は0以上の整数で入力してください。');
					return;
				}
				const invalidNames = master.value.items
					.filter((it) => {
						const t = String(inventoryInputs[it.id] ?? '').trim();
						return t !== '' && !isNonNegativeIntegerText(t);
					})
					.map((it) => it.text);
				if (invalidNames.length) {
					showSnack(`所持数が正しく入力されていないアイテムがあります:\n${invalidNames.join('、')}`);
					return;
				}

				const { bom, topoOrder, addressTable, addressCounts, noDropIds, orderMap } = master.value;
				const inv = { ...inventory };  // 最新の所持数
				const targets = qtyRows.map((r, i) => ({ id: r.id, qty: Number(qtyTexts[i]) }));
				const ids = targets.map((t) => t.id);

				// 1-2. 全目標をまとめたBOM所要量と正味所要量（所持数は目標どうしで共有）
				const rows = PuzCalc.calculateRequirements({ bom, topoOrder, targets, inventory: inv });
				// 3. 不足アイテムの抽出
				const shortages = PuzCalc.extractShortages(rows);
				// どのマップからも取得できない不足アイテムを「マップから入手できない」「マップが未登録」に分ける
				const { noDrop, unregistered: unreachable } = PuzCalc.splitUnreachableShortages(
					PuzCalc.findUnreachableShortages(shortages, addressCounts), noDropIds);
				if (unreachable.length) {
					// 開発者向け: どのマップにも登録がない素材（map.json への追加漏れの可能性）。no_drop: true のものは除く
					console.warn('[データ] 入手できるマップが map.json に登録されていないアイテム:', unreachable.map((u) => nameOf(u.id)).join('、'));
				}

				// 目標アイテムごとの内訳（そのアイテムだけを作る場合。所持数はそれぞれで全て使える前提）
				const perTarget = targets.map((t) => {
					const r = PuzCalc.calculateRequirements({ bom, topoOrder, targets: [t], inventory: inv });
					const self = r.find((x) => x.id === t.id);
					return {
						target: t,
						rows: PuzCalc.sortRequirementRows(r, bom, t.id, orderMap),
						unknownRecipes: PuzCalc.extractUnknownRecipes(r),
						summary: { id: t.id, qty: t.qty, net: self.net, craftable: self.craftable },
					};
				});

				// 4-5. マップ評価と順位付け（全目標の不足をまとめて評価）
				const scored = PuzCalc.calculateAddressScores({ table: addressTable, shortages, addressCounts, orderMap });
				let ranking = PuzCalc.rankAddresses(scored);
				if (targets.length > 1) {
					// 目標ごとに「関係する不足素材」を求め、それが1つも出ないマップに注記を付ける
					const shortageIds = new Set(shortages.filter((x) => addressCounts.get(x.id)).map((x) => x.id));
					const targetMaterials = perTarget.map((p) => {
						const reach = PuzCalc.collectReachable(bom, p.target.id);
						const materials = p.summary.net > 0
							? new Set([...reach].filter((id) => shortageIds.has(id)))
							: new Set();
						return { id: p.target.id, materials };
					});
					ranking = PuzCalc.annotateMissingTargets(ranking, addressTable, targetMaterials);
				} else {
					ranking = ranking.map((a) => ({ ...a, missingTargets: [] }));
				}

				// 表示用（タブごと）
				const views = {
					all: {
						rows: PuzCalc.sortRequirementRows(rows, bom, ids, orderMap),
						unknownRecipes: PuzCalc.extractUnknownRecipes(rows),
						summaries: perTarget.map((p) => p.summary),
					},
				};
				for (const p of perTarget) {
					views[p.target.id] = { rows: p.rows, unknownRecipes: p.unknownRecipes, summaries: [p.summary] };
				}

				result.value = {
					targets,
					rows,           // 全目標をまとめた結果（所持数一覧の「あと」表示・絞り込みに使う）
					views,
					shortages,
					unreachable,    // 入手できるマップが未登録の不足アイテム
					noDrop,         // マップから入手できない不足アイテム
					unknownRecipes: views.all.unknownRecipes,
					ranking,
					signature: currentSignature(),
				};
				resultTab.value = 'all';

				// スマホ幅では結果までスクロール
				if (window.innerWidth < 960) {
					nextTick(() => {
						const el = document.getElementById('result-card');
						if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
					});
				}
			}

			onMounted(loadAll);

			return {
				loading, ready, dataErrors,
				targetIds, targetQtyInputs, targetSelectItems, canCalculate, resultTab, resultView,
				targetTab, swordIds, swordStageSel, swordSelectItems, swordStageRows, swordLabel,
				targetRows, onTargetQtyInput, onResetTargetQty,
				inventoryInputs, inventorySearch, inventoryFilter, inventoryRows,
				result, isStale, snackbar,
				weights: PuzCalc.SCORE_WEIGHTS,
				priorityExplanation: PRIORITY_EXPLANATION,
				nameOf, fmt, kindLabel, kindColor, qtyRule, needOf,
				onInventoryInput, onCalculate,
				menuOpen,
				sortieCode, sortieName, onSortie,
				showNonzeroFilter: SHOW_NONZERO_FILTER,
			};
		},
	});

	// ----- テーマ（初期はライトモード。メニューで切り替えたモードがあればそれを使う。配色は components/common.js） -----
	const vuetify = TouPuz.createVuetify();
	app.use(vuetify).mount('#app');
})();
</script>
</body>
</html>
