<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>alarm list</title>
  <style>
    /* Morphous Coral Atoll — ライト */
    :root {
      --background:       oklch(0.979 0.019 80.1);
      --foreground:       oklch(0.266 0.047 213.5);
      --card:             oklch(0.965 0.018 89.4);
      --card-foreground:  oklch(0.266 0.047 213.5);
      --primary:          oklch(0.715 0.122 205.8);
      --muted-foreground: oklch(0.220 0.039 215.4);
      --accent:           oklch(0.731 0.166 30.3);
      --border:           oklch(0.948 0.022 171.8);
    }

    /* Morphous Coral Atoll — ダーク（OS設定に追従） */
    @media (prefers-color-scheme: dark) {
      :root {
        --background:       oklch(0.266 0.047 213.5);
        --foreground:       oklch(0.979 0.019 80.1);
        --card:             oklch(0.235 0.041 213.9);
        --card-foreground:  oklch(0.979 0.019 80.1);
        --primary:          oklch(0.846 0.103 200.0);
        --muted-foreground: oklch(0.952 0.025 178.4);
        --accent:           oklch(0.731 0.166 30.3);
        --border:           oklch(1 0 0 / 12%);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Meiryo", sans-serif;
      font-size: 13px;
      width: 300px;
      background: var(--background);
      color: var(--foreground);
    }

    header {
      background: var(--accent);
      color: var(--foreground);
      padding: 9px 14px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    #alarm-list {
      list-style: none;
    }

    #alarm-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      background: var(--card);
      color: var(--card-foreground);
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    #alarm-list li:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      white-space: nowrap;
      color: var(--primary);
    }

    .time {
      font-size: 12px;
      white-space: nowrap;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    #empty {
      padding: 16px 14px;
      text-align: center;
      background: var(--card);
      color: var(--muted-foreground);
    }
  </style>
</head>
<body>
  <header>alarm list</header>
  <ul id="alarm-list"></ul>
  <div id="empty" style="display:none">アラームなし</div>
  <script src="popup.js"></script>
</body>
</html>
